[tool.poetry]
name = "doc-ingest-pipeline"
version = "0.1.0"
description = "Headless Azure document ingestion pipeline (Blob -> Document Intelligence -> AI Search). Carved out of Azure-Samples/chat-with-your-data-solution-accelerator."
authors = []
readme = "README.md"
license = "MIT"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.10"
azure-functions = "1.24.0"
azure-storage-blob = "12.29.0"
azure-storage-queue = "12.16.0"
azure-identity = "1.25.3"
python-dotenv = "1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "7.1.0"
pytest-mock = "^3.15.0"
flake8 = "7.3.0"
black = "26.5.1"
pre-commit = "4.6.0"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = [
    "**/tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
