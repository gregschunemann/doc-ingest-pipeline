name: Infrastructure Validation

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'azure.yaml'
      - '.github/workflows/infra-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'azure.yaml'
      - '.github/workflows/infra-validate.yml'

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        if: vars.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: |
          az bicep install --version v0.34.65

      - name: Build Bicep template
        run: |
          az bicep build --file infra/main.bicep

      - name: Deployment what-if (if Azure authenticated)
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          az deployment sub what-if \
            --location swedencentral \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters environmentName=doc-ingest-ci
